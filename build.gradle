import java.nio.charset.StandardCharsets

plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
    id("com.modrinth.minotaur") version "2.8.7"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url 'https://maven.nucleoid.xyz/releases/' }
    maven { url 'https://api.modrinth.com/maven' }
}

base {
    archivesName = project.archives_base_name
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    modImplementation include("eu.pb4:polymer-core:0.15.0-beta.4+1.21.11-rc2")
    modImplementation include("xyz.nucleoid:server-translations-api:2.5.2+1.21.9-pre3")
    modImplementation "maven.modrinth:lithium:mc1.21.11-0.21.0-fabric"
    include(implementation("com.moulberry:mixinconstraints:1.0.8"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)

    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName}" }
    }
}

modrinth {
    token.set(env("MODRINTH_TOKEN"))
    projectId.set(modrinth_id)
    versionType.set(env("RELEASE_OVERRIDE") ?: mod_version.contains("alpha") ? "alpha" : !bool("BUILD_RELEASE") || mod_version.contains('-') ? "beta" : "release")
    def changelogContents = env("CHANGELOG")
    if (changelogContents != null) {
        changelog.set(changelogContents)
    } else {
        def ref = env("GITHUB_REF")
        if (ref != null && ref.startsWith("refs/tags/")) {
            changelog.set "You may view the changelog at ${env("GITHUB_SERVER_URL")}/${env("GITHUB_REPOSITORY")}/releases/tag/${URLEncoder.encode(ref.substring(10), StandardCharsets.UTF_8)}"
        } else {
            changelog.set "No changelog is available. Perhaps poke at ${env("GITHUB_SERVER_URL")}/${env("GITHUB_REPOSITORY")} for a changelog?"
        }
    }
    uploadFile.set(remapJar)
    gameVersions.set([minecraft_version])
    loaders.addAll("fabric", "quilt")
    versionNumber.set(project.version + "-" + project.minecraft_version)
    required.project "polymer"

}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}

static String env(String env) {
    return System.getenv(env)
}

static boolean bool(String env) {
    return Boolean.parseBoolean(System.getenv(env))
}
